version: "3.9"

services:
  wazuh-ai-agent:
    build: .
    container_name: wazuh-ai-agent
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # Connecting with Wazuh Indexer (OpenSearch)
      - OPENSEARCH_INDEXES=wazuh-alerts-*,wazuh-monitoring-*,wazuh-states-vulnerabilities-*,wazuh-states-inventory-*
      - OPENSEARCH_URL=https://<wazuh_IP>:9200
      - OPENSEARCH_USER=<read_only_user>
      - OPENSEARCH_PASSWORD=<opensearch_password>
      - OPENSEARCH_VERIFY_SSL=false

      # LiteLLM integration
      - LITELLM_API_BASE=<litellm_instance_URL>
      - LITELLM_API_KEY=<litellm_api_key>
      - LITELLM_MODEL=<your_AI_model>

      # Assistent Web UI access control
      - WEB_PASSWORD=<password_for_web_UI>
      - WEB_USERNAME=admin

      # Data sync configuration
      - DAYS_RANGE=0.25
      - AUTO_REFRESH_ENABLED=true
      - AUTO_REFRESH_INTERVAL=15

      # Optional email reports configuration
      - DAILY_REPORT_TIME=07:00
      - SENDGRID_API_KEY=<your_Sendgrid_api_key>
      - SENDGRID_FROM_EMAIL=<from_email>
      - SENDGRID_TO_EMAILS=<to_email>
      
      - PYTHONUNBUFFERED=1
    volumes:
      - ./data:/app/data
