# SOC-AGENT AI CHAT SERVER
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name your_domain;

    # SSL Configuration for your AI chat web UI
    ssl_certificate public_cert_path;
    ssl_certificate_key private_key_path;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Handle WebSocket Chat Traffic
    location /ws/chat {
        proxy_pass http://127.0.0.1:8000;

        # Explicit WebSocket Upgrade Headers
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable buffering for WebSockets & extend timeouts for long chat sessions
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Handle standard Web UI & Streaming text responses (SSE)
    location / {
        proxy_pass http://127.0.0.1:8000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # CRITICAL: Disable buffering so AI text streams token-by-token
        proxy_buffering off;
        proxy_read_timeout 600s;
    }
}

# =========================================================================
# HTTP TO HTTPS GLOBAL REDIRECT
# =========================================================================
server {
    listen 80;
    listen [::]:80;
    server_name your_domain;
    return 301 https://$host$request_uri;
}